[project]
name = "text2sql-backend"
version = "0.1.0"
description = "Text2SQL 智能数据分析平台 - 后端服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "sqlglot>=25.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.7",
]
# AI 相关依赖在 T3 接入主链路时启用，保持 T0 脚手架轻量
ai = [
    "langchain>=0.2",
    "langchain-community>=0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 集成测试需要 Docker（testcontainers），CI 中以 `-m "not integration"` 先跑单测
markers = [
    "integration: 需要 Docker + PostgreSQL/pgvector 容器的集成测试",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008：FastAPI 官方惯用「Depends 在参数默认值中」的依赖注入写法
ignore = ["B008"]
