# Nginx 配置（DEP-02）：前端静态资源 + /api 反向代理 + SSE 支持
server {
    listen 80;
    server_name _;

    # gzip 压缩
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # 前端静态资源（frontend 构建产物，由镜像拷贝至 /usr/share/nginx/html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;   # SPA 路由回退
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;   # 网关 trace_id 贯穿（NFR-O-04）
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # SSE 流式接口：必须关闭缓冲（FR-UI-05、§8.1）
    location /api/v1/query/stream {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # /metrics 仅供内网抓取（NFR-O-01）：生产请改为内网地址或加访问控制
    location /metrics {
        proxy_pass http://api:8000;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # 文档接口不对外（DEP-08）
    location /docs { return 404; }
}
