name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # ENV-03：集成测试使用真实 PostgreSQL+pgvector 服务容器，禁止内存数据库替代
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: t2s
          POSTGRES_PASSWORD: t2s
          POSTGRES_DB: text2sql_meta
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U t2s -d text2sql_meta"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ITEST_DB_HOST: localhost
      ITEST_DB_PORT: "5433"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (coverage collect)
        run: pytest -m "not integration" -q --cov=app --cov-report=term --cov-append
      - name: Integration tests (coverage gate >=70%, P-54)
        run: pytest -m integration -q --cov=app --cov-report=term --cov-append --cov-fail-under=70
      - name: Eval offline gate（EV-04：安全与时间解析用例 100% 门禁）
        run: python -m eval.run --offline --gate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Type check & build
        run: npm run build
