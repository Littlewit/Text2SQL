# 生产部署编排（DEP-01~10）
# 与 docker-compose.dev.yml 的差异：无代码挂载/热重载、entrypoint 自动迁移、
# 资源限制、restart 策略、DEBUG 关闭、/metrics 内网限制。
# 用法：docker compose -f docker-compose.yml --env-file .env up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: t2s-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-t2s}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置}
      POSTGRES_DB: ${POSTGRES_DB:-text2sql_meta}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t2s -d text2sql_meta"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # DEP-10：资源上限（P-52 待定，以下为保守基线）
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  redis:
    image: redis:7-alpine
    container_name: t2s-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  api:
    build: ./backend
    container_name: t2s-api
    environment:
      DEBUG: "false"                                    # 生产关闭文档接口（DEP-08）
      METADATA_DB_URL: postgresql+psycopg://${POSTGRES_USER:-t2s}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-text2sql_meta}
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置强密钥}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?请在 .env 中设置 32 字节 base64 密钥}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  worker:
    build: ./backend
    container_name: t2s-worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO"]
    environment:
      METADATA_DB_URL: postgresql+psycopg://${POSTGRES_USER:-t2s}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-text2sql_meta}
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
      SECRET_KEY: ${SECRET_KEY:?}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  web:
    build: ./frontend
    container_name: t2s-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

volumes:
  pgdata:
